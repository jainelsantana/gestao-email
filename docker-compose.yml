services:
  web:
    build: .
    container_name: email_gestao_web
    restart: unless-stopped
    ports:
      - "3811:8991"
    expose:
      - "8991"
    volumes:
      - sqlite_data:/app/data
      - static_data:/app/staticfiles
      - ./assets:/app/assets:ro
    environment:
      DB_ENGINE: ${DB_ENGINE:-sqlite}
      SQLITE_PATH: /app/data/db.sqlite3
      APP_PORT: 8991
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost,10.138.5.56,qke9lr9cs0f4na7wjtwifsmi.10.138.5.56.sslip.io}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://qke9lr9cs0f4na7wjtwifsmi.10.138.5.56.sslip.io}
    command: sh -c "gunicorn config.wsgi:application --bind 0.0.0.0:8991 --workers 3 --timeout 120"

volumes:
  sqlite_data:
  static_data:
